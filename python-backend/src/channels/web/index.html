<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Agent Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0b0d14; --panel: #12151e; --card: #1a1e2e; --border: #252a3a;
  --text: #e2e8f0; --text2: #8b949e; --text3: #484f5a;
  --blue: #3b82f6; --purple: #8b5cf6; --green: #10b981;
  --orange: #f59e0b; --red: #ef4444; --cyan: #06b6d4;
  --radius: 12px; --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

/* ─── HEADER ─────────────────────────── */
header {
  height: 56px; display: flex; align-items: center; gap: 16px;
  padding: 0 20px; background: linear-gradient(135deg, #131620, #1a1e2e);
  border-bottom: 1px solid var(--border); position: relative; z-index: 10;
}
.logo { font-weight: 700; font-size: 16px; letter-spacing: -0.5px; white-space: nowrap; }
.logo span { background: linear-gradient(135deg, var(--blue), var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

select {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 8px; font-family: var(--font); font-size: 13px;
  cursor: pointer; outline: none;
}
select:focus { border-color: var(--blue); }

.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 20px; font-size: 11px; font-weight: 500; background: var(--card);
  border: 1px solid var(--border);
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.badge.model { color: var(--cyan); }

.spacer { flex: 1; }

.btn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text); font-family: var(--font);
  font-size: 12px; cursor: pointer; transition: all .15s;
}
.btn:hover { background: var(--border); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: #2563eb; }

/* ─── MAIN LAYOUT ────────────────────── */
main { display: flex; height: calc(100vh - 56px); }

.chat-panel {
  flex: 1; display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
}

.debug-panel {
  width: 380px; display: flex; flex-direction: column;
  background: var(--panel); overflow: hidden;
}

/* ─── MESSAGES ───────────────────────── */
.messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.messages::-webkit-scrollbar { width: 6px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn .25s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg .avatar {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.msg.user .avatar { background: var(--blue); }
.msg.assistant .avatar { background: linear-gradient(135deg, var(--purple), var(--blue)); }

.msg .bubble {
  padding: 10px 14px; border-radius: var(--radius); line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; font-size: 13.5px;
}
.msg.user .bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

.msg .bubble a { color: var(--cyan); text-decoration: underline; }
.msg .bubble img {
  max-width: 280px; border-radius: 8px; margin: 6px 0; display: block;
  border: 1px solid var(--border); cursor: pointer; transition: transform .2s;
}
.msg .bubble img:hover { transform: scale(1.03); }
.msg .bubble strong { color: var(--cyan); }

.typing-indicator { display: flex; gap: 4px; padding: 14px; }
.typing-indicator .dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--text3);
  animation: bounce .6s infinite alternate;
}
.typing-indicator .dot:nth-child(2) { animation-delay: .15s; }
.typing-indicator .dot:nth-child(3) { animation-delay: .3s; }

/* ─── INPUT ──────────────────────────── */
.input-area {
  padding: 16px 20px; border-top: 1px solid var(--border);
  background: var(--panel);
}
.image-row { display: flex; gap: 8px; margin-bottom: 8px; }
.image-row input {
  flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 8px; font-size: 12px; font-family: var(--mono);
  outline: none;
}
.image-row input:focus { border-color: var(--purple); }

.msg-row { display: flex; gap: 8px; }
.msg-row textarea {
  flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: 10px 14px; border-radius: var(--radius); font-family: var(--font);
  font-size: 13.5px; resize: none; height: 44px; outline: none; line-height: 1.4;
}
.msg-row textarea:focus { border-color: var(--blue); }
.msg-row button {
  padding: 0 20px; border: none; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: #fff; font-family: var(--font); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: opacity .15s;
}
.msg-row button:hover { opacity: .9; }
.msg-row button:disabled { opacity: .4; cursor: not-allowed; }

/* ─── DEBUG PANEL ────────────────────── */
.debug-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.debug-header h3 { font-size: 13px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--text2); }

/* Graph mini-viz */
.graph-viz {
  display: flex; align-items: center; gap: 4px; padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.gnode {
  padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500;
  font-family: var(--mono); background: var(--card); border: 1px solid var(--border);
  transition: all .3s;
}
.gnode.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 0 12px rgba(59, 130, 246, .4); }
.gnode.done { border-color: var(--green); color: var(--green); }
.garrow { color: var(--text3); font-size: 12px; }

/* Stats bar */
.stats-bar {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; gap: 16px; font-size: 11px; font-family: var(--mono); color: var(--text2);
}
.stat { display: flex; align-items: center; gap: 4px; }
.stat .label { color: var(--text3); }

/* Trace list */
.trace { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.trace::-webkit-scrollbar { width: 4px; }
.trace::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.trace-step {
  padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; animation: fadeIn .2s;
}
.trace-step .step-header {
  display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-weight: 600;
}
.trace-step .step-tag {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px;
}
.trace-step .step-tag.node { background: rgba(59, 130, 246, .15); color: var(--blue); }
.trace-step .step-tag.tool { background: rgba(245, 158, 11, .15); color: var(--orange); }
.trace-step .step-tag.llm { background: rgba(139, 92, 246, .15); color: var(--purple); }
.trace-step .step-tag.error { background: rgba(239, 68, 68, .15); color: var(--red); }

.trace-step .step-body {
  font-family: var(--mono); font-size: 11px; color: var(--text2);
  white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto;
  margin-top: 4px; padding: 6px 8px; background: rgba(0,0,0,.2); border-radius: 4px;
}
.trace-step.running { border-color: var(--blue); box-shadow: 0 0 8px rgba(59, 130, 246, .15); }

/* ─── WELCOME ────────────────────────── */
.welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; gap: 12px; color: var(--text3);
}
.welcome .icon { font-size: 48px; }
.welcome h2 { font-size: 20px; color: var(--text); }
.welcome p { font-size: 13px; max-width: 360px; text-align: center; line-height: 1.6; }

/* ─── ANIMATIONS ─────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes bounce { to { transform: translateY(-4px); opacity: .5; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 4px rgba(59,130,246,.2); } 50% { box-shadow: 0 0 14px rgba(59,130,246,.5); } }
</style>
</head>
<body>

<header>
  <div class="logo">🤖 <span>Sales Agent Studio</span></div>
  <select id="tenant-select"><option value="">Loading...</option></select>
  <div id="agent-badge" class="badge" style="display:none"><div class="dot"></div><span></span></div>
  <div id="model-badge" class="badge model" style="display:none"></div>
  <div class="spacer"></div>
  <div id="thread-badge" class="badge" style="display:none">Thread: <span></span></div>
  <button class="btn" onclick="newThread()">+ New Thread</button>
</header>

<main>
  <div class="chat-panel">
    <div class="messages" id="messages">
      <div class="welcome">
        <div class="icon">🏪</div>
        <h2>Sales Agent Studio</h2>
        <p>Select a tenant above and start chatting. Watch the agent flow in real-time on the right panel.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="image-row">
        <input type="text" id="image-url" placeholder="📎 Paste image URL (optional)">
      </div>
      <div class="msg-row">
        <textarea id="msg-input" placeholder="Type your message..." rows="1"></textarea>
        <button id="send-btn" onclick="send()">Send ➤</button>
      </div>
    </div>
  </div>

  <div class="debug-panel">
    <div class="debug-header">
      <h3>⚡ Agent Flow</h3>
      <button class="btn" onclick="clearTrace()" style="font-size:11px">Clear</button>
    </div>
    <div class="graph-viz">
      <div class="gnode" id="gn-start">START</div>
      <div class="garrow">→</div>
      <div class="gnode" id="gn-assistant">assistant</div>
      <div class="garrow">⇄</div>
      <div class="gnode" id="gn-tools">tools</div>
      <div class="garrow">→</div>
      <div class="gnode" id="gn-end">END</div>
    </div>
    <div class="stats-bar" id="stats">
      <div class="stat"><span class="label">Tokens In:</span> <span id="stat-in">0</span></div>
      <div class="stat"><span class="label">Out:</span> <span id="stat-out">0</span></div>
      <div class="stat"><span class="label">Total:</span> <span id="stat-total">0</span></div>
    </div>
    <div class="trace" id="trace"></div>
  </div>
</main>

<script>
// ─── STATE ────────────────────────────
let tenants = [];
let tenantId = null;
let threadId = null;
let isStreaming = false;
let totalIn = 0, totalOut = 0;

const $ = id => document.getElementById(id);
const msgs = $('messages');
const trace = $('trace');
const input = $('msg-input');
const sendBtn = $('send-btn');

// ─── INIT ─────────────────────────────
(async () => {
  const res = await fetch('/api/tenants');
  tenants = await res.json();
  const sel = $('tenant-select');
  sel.innerHTML = '<option value="">— Select Tenant —</option>'
    + tenants.map(t => `<option value="${t.id}">${t.business_name} (${t.agent_name})</option>`).join('');
  sel.onchange = () => selectTenant(sel.value);
})();

function selectTenant(id) {
  if (!id) return;
  tenantId = id;
  const t = tenants.find(x => x.id === id);
  $('agent-badge').style.display = 'inline-flex';
  $('agent-badge').querySelector('span').textContent = `${t.agent_name} — ${t.agent_role}`;
  $('model-badge').style.display = 'inline-flex';
  $('model-badge').textContent = `🧠 ${t.provider}`;
  newThread();
  msgs.innerHTML = '';
  addSystemMsg(`Connected to ${t.business_name}. Agent: ${t.agent_name} (${t.language})`);
}

function newThread() {
  threadId = null;
  $('thread-badge').style.display = 'none';
  msgs.innerHTML = '';
  clearTrace();
  totalIn = 0; totalOut = 0; updateStats();
  if (tenantId) {
    const t = tenants.find(x => x.id === tenantId);
    addSystemMsg(`New conversation started with ${t.business_name}`);
  }
}

// ─── SEND ─────────────────────────────
async function send() {
  const text = input.value.trim();
  if (!text || !tenantId || isStreaming) return;

  const imageUrl = $('image-url').value.trim() || null;
  input.value = '';
  $('image-url').value = '';
  isStreaming = true;
  sendBtn.disabled = true;

  // User message
  addMsg('user', text);
  if (imageUrl) addMsg('user', `📎 Image: ${imageUrl}`);

  // Typing indicator
  const typing = addTyping();

  // Start assistant message placeholder
  let assistantBubble = null;
  let assistantText = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        tenant_id: tenantId,
        thread_id: threadId,
        message: text,
        image_url: imageUrl,
      }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          handleEvent(evt);
        } catch(e) { /* ignore parse errors */ }
      }
    }

    function handleEvent(evt) {
      switch (evt.type) {
        case 'meta':
          threadId = evt.thread_id;
          $('thread-badge').style.display = 'inline-flex';
          $('thread-badge').querySelector('span').textContent = threadId.split(':')[1] || threadId;
          break;

        case 'node_start':
          setGraphNode(evt.node, 'active');
          addTrace('node', `▶ Node: ${evt.node}`, null, true);
          break;

        case 'node_end':
          setGraphNode(evt.node, 'done');
          break;

        case 'token':
          if (typing.parentNode) typing.remove();
          if (!assistantBubble) {
            assistantBubble = addMsg('assistant', '');
          }
          assistantText += evt.content;
          assistantBubble.innerHTML = renderRichText(assistantText);
          msgs.scrollTop = msgs.scrollHeight;
          break;

        case 'llm_end':
          if (evt.usage && (evt.usage.input || evt.usage.output)) {
            totalIn += evt.usage.input || 0;
            totalOut += evt.usage.output || 0;
            updateStats();
            addTrace('llm', `LLM — ${evt.usage.input || 0} in / ${evt.usage.output || 0} out tokens`);
          }
          if (evt.tool_calls && evt.tool_calls.length) {
            for (const tc of evt.tool_calls) {
              addTrace('tool', `🔧 Calling: ${tc.name}`, JSON.stringify(tc.args, null, 2));
            }
          }
          break;

        case 'tool_start':
          addTrace('tool', `⚙️ ${evt.name}`, evt.input, true);
          break;

        case 'tool_end':
          addTrace('tool', `✅ ${evt.name} result`, evt.output);
          break;

        case 'error':
          addTrace('error', `❌ Error`, evt.message);
          addMsg('assistant', `⚠️ Error: ${evt.message}`);
          break;

        case 'done':
          resetGraphNodes();
          setGraphNode('end', 'done');
          break;
      }
    }

  } catch (err) {
    addMsg('assistant', `⚠️ Connection error: ${err.message}`);
  } finally {
    if (typing.parentNode) typing.remove();
    if (!assistantBubble && assistantText === '') {
      // no text was streamed
    }
    isStreaming = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

// ─── RICH TEXT RENDERER ───────────────
function renderRichText(text) {
  let html = escHtml(text);
  // Render image URLs as <img> tags
  html = html.replace(/Image:\s*(https:\/\/[^\s]+)/g, '<br><img src="$1" alt="product" loading="lazy"><br>');
  // Render markdown-style images ![alt](url)
  html = html.replace(/!\[([^\]]*)\]\((https?:\/\/[^)]+)\)/g, '<br><img src="$2" alt="$1" loading="lazy"><br>');
  // Render **bold**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Render plain URLs as links (but not ones already in img tags)
  html = html.replace(/(^|[^"=])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank">$2</a>');
  // Line breaks
  html = html.replace(/\n/g, '<br>');
  return html;
}

// ─── DOM HELPERS ──────────────────────
function addMsg(role, text) {
  const welcome = msgs.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant') {
    bubble.innerHTML = renderRichText(text);
  } else {
    bubble.textContent = text;
  }
  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble; // return bubble ref for streaming updates
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.style.cssText = 'text-align:center;color:var(--text3);font-size:12px;padding:8px;';
  div.textContent = `— ${text} —`;
  msgs.appendChild(div);
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

// ─── TRACE ────────────────────────────
function addTrace(type, title, body, running = false) {
  const div = document.createElement('div');
  div.className = `trace-step${running ? ' running' : ''}`;
  let html = `<div class="step-header"><span class="step-tag ${type}">${type}</span> ${title}</div>`;
  if (body) html += `<div class="step-body">${escHtml(body)}</div>`;
  div.innerHTML = html;
  trace.appendChild(div);
  trace.scrollTop = trace.scrollHeight;
}

function clearTrace() { trace.innerHTML = ''; resetGraphNodes(); }

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── GRAPH VIZ ────────────────────────
function setGraphNode(name, state) {
  const map = {start:'gn-start', assistant:'gn-assistant', tools:'gn-tools', end:'gn-end'};
  const el = $(map[name]);
  if (!el) return;
  el.classList.remove('active', 'done');
  if (state) el.classList.add(state);
}
function resetGraphNodes() {
  document.querySelectorAll('.gnode').forEach(n => n.classList.remove('active', 'done'));
}

// ─── STATS ────────────────────────────
function updateStats() {
  $('stat-in').textContent = totalIn;
  $('stat-out').textContent = totalOut;
  $('stat-total').textContent = totalIn + totalOut;
}

// ─── KEYBOARD ─────────────────────────
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
