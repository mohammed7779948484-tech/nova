services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./.env:/app/.env
      - ./tenants:/app/tenants
    environment:
      - ENVIRONMENT=development
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload

  test:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./.env:/app/.env
    environment:
      - ENVIRONMENT=test
    command: pytest tests/ -v